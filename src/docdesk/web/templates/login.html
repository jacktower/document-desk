{% extends "base.html" %}{% block title %}Sign in - Document Desk{% endblock %}
{% block body %}<div class="card login"><h1>Sign in</h1>
<form method="post" action="/login"><p><label>Operator password<br><input type="password" name="password" autofocus required style="width:100%"></label></p>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<button class="primary" type="submit">Sign in</button></form></div>{% endblock %}
