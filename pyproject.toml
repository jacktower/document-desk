[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docdesk"
version = "1.0.0"
description = "Document Desk: event-driven document classification and metadata extraction on Azure"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyodbc>=5.1",
  "httpx>=0.27",
  "pypdf>=4.2",
  "Pillow>=10.3",
  "azure-identity>=1.17",
  "azure-servicebus>=7.12",
  "azure-storage-blob>=12.20",
  "azure-keyvault-secrets>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4.2", "jsonschema>=4.22"]

[project.scripts]
docdesk = "docdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docdesk = ["web/templates/*", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["devtools", "tests"]
addopts = "-ra"
markers = ["live: needs real Azure resources (skipped unless DOCDESK_LIVE=1)"]
